# .github/workflows/deploy.yml
# ============================================================
# WORKFLOW DE DEPLOY AUTOMÁTICO
# Se activa en cada push a main
# Flujo: Python fetcha datos → Astro hace build → Pages despliega
# ============================================================

name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  # Permite que update-data.yml dispare este workflow
  workflow_call:

# Permisos mínimos necesarios para publicar en GitHub Pages
# Principio de mínimos permisos: solo lo que el job necesita
permissions:
  contents: read      # leer el repositorio
  pages: write        # publicar en GitHub Pages
  id-token: write     # autenticarse con GitHub Pages via OIDC

# Evita deploys simultáneos — si hay dos pushes seguidos,
# cancela el anterior y corre solo el más reciente
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # ============================================================
  # JOB 1: Build del sitio con Astro
  # ============================================================
  build:
    name: Build con Astro
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias Node
        run: npm ci

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build con Astro
        run: npm run build

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ============================================================
  # JOB 2: Deploy a GitHub Pages
  # ============================================================
  deploy:
    name: Deploy a GitHub Pages
    runs-on: ubuntu-latest
    needs: build  # espera que build termine exitosamente

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Resumen del deploy
        run: |
          echo "## ✅ Deploy exitoso" >> $GITHUB_STEP_SUMMARY
          echo "🌐 Sitio publicado en: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "🕐 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY