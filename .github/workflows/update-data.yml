# .github/workflows/update-data.yml
# ============================================================
# WORKFLOW DE ACTUALIZACIÓN PROGRAMADA
# Corre manual
# hace commit automático y dispara el deploy
# ============================================================

name: Actualizar datos de farmacias

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Recordatorio de actualización
    runs-on: ubuntu-latest

    steps:
      - name: Instrucciones
        run: |
          echo "## ℹ️ Actualización de datos" >> $GITHUB_STEP_SUMMARY
          echo "La API del MINSAL bloquea IPs de GitHub Actions." >> $GITHUB_STEP_SUMMARY
          echo "Para actualizar los datos:" >> $GITHUB_STEP_SUMMARY
          echo "1. Correr localmente: \`uv run python scripts/fetch_farmacias.py\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Commit del JSON: \`git add src/data/farmacias.json && git commit -m 'chore: actualizar datos farmacias'\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Push a develop y PR a main" >> $GITHUB_STEP_SUMMARY